name: Déploiement o2switch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Une seule publication à la fois ; on laisse finir celle en cours.
concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Envoie dist/ dans public_html par FTPS. Seuls les fichiers modifiés partent ; ceux
      # qu'une publication précédente avait envoyés et qui n'existent plus sont supprimés.
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVEUR }}
          username: ${{ secrets.FTP_UTILISATEUR }}
          password: ${{ secrets.FTP_MOT_DE_PASSE }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DOSSIER || 'public_html/' }}
